<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UHS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0c0f14;
      --surface: #151921;
      --surface2: #1c2130;
      --border: #2a3040;
      --text: #e4e8f0;
      --text2: #8892a6;
      --accent: #3b7a57;
      --accent2: #4a9568;
      --danger: #c0392b;
      --gold: #c4953a
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh
    }

    .material-symbols-outlined {
      font-size: 20px;
      vertical-align: middle
    }

    /* Login */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px;
      max-width: 400px;
      width: 100%;
      text-align: center
    }

    .login-box h1 {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px
    }

    .login-box h2 {
      font-size: 24px;
      margin-bottom: 32px;
      font-weight: 600
    }

    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 16px;
      outline: none
    }

    .login-box input:focus {
      border-color: var(--accent)
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer
    }

    .login-box button:hover {
      background: var(--accent2)
    }

    .login-error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none
    }

    /* Layout */
    .app {
      display: none;
      min-height: 100vh
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      overflow-y: auto;
      z-index: 10
    }

    .sidebar .brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px
    }

    .sidebar .brand h3 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold)
    }

    .sidebar .brand p {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s
    }

    .sidebar a:hover,
    .sidebar a.active {
      color: var(--text);
      background: var(--surface2)
    }

    .sidebar a.active {
      border-left: 3px solid var(--accent);
      padding-left: 21px
    }

    .main {
      margin-left: 240px;
      padding: 32px 40px;
      max-width: 900px
    }

    .main h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px
    }

    .main .subtitle {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 32px
    }

    /* Form Elements */
    .field {
      margin-bottom: 24px
    }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 8px;
      font-weight: 600
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent)
    }

    .field textarea {
      min-height: 100px
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      border: 2px solid var(--border);
      cursor: grab;
      background: var(--bg)
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .gallery-item .remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      background: rgba(0, 0, 0, .7);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s
    }

    .gallery-item:hover .remove-btn {
      opacity: 1
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed var(--border);
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      margin-bottom: 24px
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(59, 122, 87, .08)
    }

    .upload-zone p {
      color: var(--text2);
      font-size: 14px
    }

    .upload-zone .material-symbols-outlined {
      font-size: 36px;
      color: var(--text2);
      margin-bottom: 8px;
      display: block
    }

    /* Buttons */
    .btn {
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .15s
    }

    .btn-primary {
      background: var(--accent);
      color: #fff
    }

    .btn-primary:hover {
      background: var(--accent2)
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger)
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff
    }

    .btn:disabled {
      opacity: .5;
      cursor: wait
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      background: #1a7a42;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all .3s;
      z-index: 100
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1
    }

    .toast.error {
      background: var(--danger)
    }

    /* List editor */
    .list-editor .list-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center
    }

    .list-editor .list-item input {
      flex: 1
    }

    .list-editor .list-item button {
      width: 36px;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .list-editor .list-item button:hover {
      color: var(--danger);
      border-color: var(--danger)
    }

    .add-item-btn {
      padding: 8px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .add-item-btn:hover {
      color: var(--text);
      border-color: var(--accent)
    }

    /* Billing page */
    .billing-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .billing-form .field {
      margin-bottom: 0
    }

    .billing-form .full-width {
      grid-column: 1 / -1
    }

    .billing-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap
    }

    .billing-actions .btn {
      flex: none
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border)
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px
    }

    .history-table th,
    .history-table td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border)
    }

    .history-table th {
      color: var(--text2);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600
    }

    .history-table tr:hover td {
      background: var(--surface2)
    }

    .history-table .btn {
      padding: 6px 12px;
      font-size: 11px
    }

    .contract-preview {
      background: #fff;
      color: #000;
      padding: 40px;
      margin-top: 16px;
      font-family: 'Times New Roman', serif;
      font-size: 13px;
      line-height: 1.6;
      max-height: 500px;
      overflow-y: auto;
      border: 1px solid var(--border)
    }

    .contract-preview h2 {
      text-align: center;
      font-size: 16px;
      margin-bottom: 20px
    }

    .billing-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px
    }

    .billing-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      text-align: center
    }

    .billing-stat .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent)
    }

    .billing-stat .stat-label {
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px
    }

    /* Responsive */
    @media(max-width:768px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
        display: flex;
        overflow-x: auto;
        padding: 0
      }

      .sidebar .brand {
        display: none
      }

      .sidebar a {
        white-space: nowrap;
        padding: 16px
      }

      .main {
        margin-left: 0;
        padding: 20px
      }

      .billing-form {
        grid-template-columns: 1fr
      }

      .billing-stats {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>

  <!-- Login Screen -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-box">
      <h1>Ultimate Hunting Safaris</h1>
      <h2>Admin Panel</h2>
      <div class="login-error" id="loginError">Invalid password</div>
      <input type="password" id="passwordInput" placeholder="Enter admin password" autofocus />
      <button onclick="login()">Sign In</button>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <nav class="sidebar">
      <div class="brand">
        <h3>UHS Admin</h3>
        <p>Content Manager</p>
      </div>
      <a href="#" data-page="homepage" class="active"><span class="material-symbols-outlined">home</span> Homepage</a>
      <a href="#" data-page="services"><span class="material-symbols-outlined">confirmation_number</span> Services</a>
      <a href="#" data-page="gallery"><span class="material-symbols-outlined">photo_library</span> Gallery</a>
      <a href="#" data-page="about"><span class="material-symbols-outlined">info</span> About</a>
      <a href="#" data-page="contact"><span class="material-symbols-outlined">mail</span> Contact</a>
      <a href="#" data-page="global"><span class="material-symbols-outlined">settings</span> Global</a>
      <a href="#" data-page="billing" style="border-top:1px solid var(--border);margin-top:8px;padding-top:20px"><span
          class="material-symbols-outlined">receipt_long</span> Billing</a>
      <a href="#" onclick="logout()" style="margin-top:auto;color:var(--danger)"><span
          class="material-symbols-outlined">logout</span> Logout</a>
    </nav>
    <div class="main" id="mainContent">
      <h1 id="pageTitle">Homepage</h1>
      <p class="subtitle" id="pageSubtitle">Edit homepage content</p>
      <div id="editorArea"></div>
      <div id="saveArea" style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">
        <button class="btn btn-primary" id="saveBtn" onclick="saveContent()">
          <span class="material-symbols-outlined">save</span> Save Changes
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let token = localStorage.getItem('uhs_token');
    let currentPage = 'homepage';
    let contentData = {};

    // Auth
    async function login() {
      const pw = document.getElementById('passwordInput').value;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (res.ok) {
          token = data.token;
          localStorage.setItem('uhs_token', token);
          showApp();
        } else {
          document.getElementById('loginError').style.display = 'block';
        }
      } catch (e) {
        document.getElementById('loginError').textContent = 'Connection error';
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('uhs_token');
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadPage('homepage');
    }

    document.getElementById('passwordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    // Navigation
    document.querySelectorAll('.sidebar a[data-page]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        loadPage(a.dataset.page);
      });
    });

    // Load content
    async function loadPage(page) {
      currentPage = page;
      const titles = { homepage: 'Homepage', services: 'Services', gallery: 'Gallery', about: 'About', contact: 'Contact', global: 'Global Settings', billing: 'Billing' };
      const subtitles = { homepage: 'Hero, story, team & CTA', services: 'Hunting packages', gallery: 'Photos & layout', about: 'Story & team bios', contact: 'Channels & form', global: 'Site-wide settings', billing: 'Generate contracts & invoices' };
      document.getElementById('pageTitle').textContent = titles[page] || page;
      document.getElementById('pageSubtitle').textContent = subtitles[page] || '';

      // Billing page doesn't use the content API
      if (page === 'billing') {
        document.getElementById('saveArea').style.display = 'none';
        renderBillingPage();
        return;
      }
      document.getElementById('saveArea').style.display = '';

      try {
        const res = await fetch(`/api/content?page=${page}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        contentData = await res.json();
        renderEditor(page, contentData);
      } catch (e) {
        document.getElementById('editorArea').innerHTML = '<p style="color:var(--danger)">Failed to load content</p>';
      }
    }

    // Save content
    async function saveContent() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined">hourglass_empty</span> Saving...';

      collectFormData();

      try {
        const res = await fetch(`/api/content?page=${currentPage}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(contentData)
        });
        if (res.ok) {
          showToast('Content saved successfully');
        } else {
          showToast('Save failed', true);
        }
      } catch (e) {
        showToast('Connection error', true);
      }
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined">save</span> Save Changes';
    }

    // Collect form values back into contentData
    function collectFormData() {
      document.querySelectorAll('[data-path]').forEach(el => {
        const path = el.dataset.path.split('.');
        let obj = contentData;
        for (let i = 0; i < path.length - 1; i++) {
          if (obj[path[i]] === undefined) obj[path[i]] = {};
          obj = obj[path[i]];
        }
        const key = path[path.length - 1];
        if (el.tagName === 'TEXTAREA' && el.dataset.type === 'array') {
          obj[key] = el.value.split('\n').filter(l => l.trim());
        } else {
          obj[key] = el.value;
        }
      });
    }

    // Render editor for each page type
    function renderEditor(page, data) {
      const area = document.getElementById('editorArea');
      let html = '';

      if (page === 'homepage') {
        html = renderSection('Hero', [
          field('hero.tagline', 'Tagline', data.hero?.tagline),
          field('hero.title', 'Title', data.hero?.title),
          field('hero.ctaText', 'Button Text', data.hero?.ctaText),
        ]) + renderSection('Our Story', [
          field('story.label', 'Label', data.story?.label),
          field('story.title', 'Title', data.story?.title),
          textarea('story.paragraphs', 'Paragraphs (one per line)', (data.story?.paragraphs || []).join('\n'), 'array'),
          field('story.ctaText', 'Button Text', data.story?.ctaText),
        ]) + renderSection('Expertise', [
          field('expertise.label', 'Label', data.expertise?.label),
          field('expertise.title', 'Title', data.expertise?.title),
          textarea('expertise.description', 'Description', data.expertise?.description),
          field('expertise.ctaText', 'Button Text', data.expertise?.ctaText),
        ]) + renderSection('Call to Action', [
          field('cta.title', 'Title', data.cta?.title),
          field('cta.description', 'Description', data.cta?.description),
          field('cta.buttonText', 'Button Text', data.cta?.buttonText),
        ]);
      }

      else if (page === 'gallery') {
        html = renderSection('Hero', [
          field('hero.label', 'Label', data.hero?.label),
          textarea('hero.quote', 'Quote', data.hero?.quote),
        ]) + renderSection('Heading', [
          field('heading', 'Gallery Heading', data.heading),
        ]) + `<div class="card"><h3><span class="material-symbols-outlined">photo_library</span> Gallery Images</h3>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <span class="material-symbols-outlined">cloud_upload</span>
        <p>Drop images here or click to upload</p>
        <p style="font-size:12px;color:var(--text2);margin-top:4px">Auto-converted to WebP</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleUpload(this.files)"/>
    </div>`;
      }

      else if (page === 'about') {
        html = renderSection('Our Story', [
          field('story.label', 'Label', data.story?.label),
          field('story.title', 'Title', data.story?.title),
          textarea('story.paragraphs', 'Paragraphs (one per line)', (data.story?.paragraphs || []).join('\n'), 'array'),
        ]);
        (data.team || []).forEach((m, i) => {
          html += renderSection(`Team: ${m.name}`, [
            field(`team.${i}.name`, 'Name', m.name),
            field(`team.${i}.role`, 'Role', m.role),
            textarea(`team.${i}.bio`, 'Bio', m.bio),
          ]);
        });
      }

      else if (page === 'contact') {
        html = renderSection('Hero', [
          field('hero.label', 'Label', data.hero?.label),
          field('hero.title', 'Title', data.hero?.title),
          field('hero.description', 'Description', data.hero?.description),
        ]) + renderSection('Channels', [
          field('channels.instagram.handle', 'Instagram Handle', data.channels?.instagram?.handle),
          field('channels.instagram.url', 'Instagram URL', data.channels?.instagram?.url),
          field('channels.whatsapp.number', 'WhatsApp Number', data.channels?.whatsapp?.number),
          field('channels.whatsapp.url', 'WhatsApp URL', data.channels?.whatsapp?.url),
          field('channels.email.address', 'Email', data.channels?.email?.address),
        ]) + renderSection('Form', [
          field('form.title', 'Form Title', data.form?.title),
          field('form.description', 'Form Description', data.form?.description),
          field('form.formspreeId', 'Formspree ID', data.form?.formspreeId),
        ]);
      }

      else if (page === 'services') {
        html = renderSection('Hero', [
          field('hero.label', 'Label', data.hero?.label),
          field('hero.title', 'Title', data.hero?.title),
          textarea('hero.description', 'Description', data.hero?.description),
        ]) + renderSection('Section Header', [
          field('sectionLabel', 'Label', data.sectionLabel),
          field('sectionTitle', 'Title', data.sectionTitle),
        ]);
        (data.packages || []).forEach((pkg, i) => {
          let fields = [
            field(`packages.${i}.label`, 'Label', pkg.label),
            field(`packages.${i}.title`, 'Title', pkg.title),
            textarea(`packages.${i}.description`, 'Description', pkg.description || ''),
            textarea(`packages.${i}.inclusions`, 'Inclusions (one per line)', (pkg.inclusions || []).join('\n'), 'array'),
          ];

          if (pkg.id === 'package-nz') {
            fields.push(field(`packages.${i}.subtitle`, 'Subtitle', pkg.subtitle));
            fields.push(textarea(`packages.${i}.beginnerFeatures`, 'Beginner Features (one per line)', (pkg.beginnerFeatures || []).join('\n'), 'array'));

    function field(path, label, value) {
      return `<div class="field"><label>${label}</label><input data-path="${path}" value="${escHtml(value || '')}"/></div>`;
    }
    function textarea(path, label, value, type) {
      return `<div class="field"><label>${label}</label><textarea data-path="${path}" ${type ? `data-type="${type}"` : ''} rows="4">${escHtml(value || '')}</textarea></div>`;
    }
    function renderSection(title, fields) {
      return `<div class="card"><h3>${title}</h3>${fields.join('')}</div>`;
    }
    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Gallery management
    function renderGalleryGrid(images) {
      const grid = document.getElementById('galleryGrid');
      if (!grid) return;
      grid.innerHTML = images.map((img, i) => `
    <div class="gallery-item" draggable="true" data-index="${i}">
      <img src="${img._tempUrl ? img._tempUrl : '/' + img.src}" alt="Gallery ${i + 1}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22><rect fill=%22%231c2130%22 width=%22200%22 height=%22150%22/><text x=%2250%%22 y=%2250%%22 fill=%22%23555%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2212%22>${escHtml(img.src)}</text></svg>'"/>
      <button class="remove-btn" onclick="removeGalleryImage(${i})"><span class="material-symbols-outlined" style="font-size:16px">close</span></button>
    </div>
  `).join('');

      // Drag and drop reorder
      grid.querySelectorAll('.gallery-item').forEach(item => {
        item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', item.dataset.index); item.style.opacity = '0.4'; });
        item.addEventListener('dragend', () => { item.style.opacity = '1'; });
        item.addEventListener('dragover', e => { e.preventDefault(); item.style.borderColor = 'var(--accent)'; });
        item.addEventListener('dragleave', () => { item.style.borderColor = 'var(--border)'; });
        item.addEventListener('drop', e => {
          e.preventDefault();
          item.style.borderColor = 'var(--border)';
          const from = parseInt(e.dataTransfer.getData('text/plain'));
          const to = parseInt(item.dataset.index);
          if (from !== to) {
            const imgs = contentData.images;
            const [moved] = imgs.splice(from, 1);
            imgs.splice(to, 0, moved);
            renderGalleryGrid(imgs);
          }
        });
      });
    }

    function removeGalleryImage(index) {
      if (!confirm('Remove this image from the gallery?')) return;
      contentData.images.splice(index, 1);
      renderGalleryGrid(contentData.images);
    }

    async function handleUpload(files) {
      for (const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('directory', 'photo_gallery');
        showToast(`Uploading ${file.name}...`);

        // Generate an immediate local preview URL
        const tempUrl = URL.createObjectURL(file);

        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            contentData.images = contentData.images || [];
            contentData.images.push({
              src: data.path,
              colSpan: 4,
              height: 400,
              effect: 'none',
              _tempUrl: tempUrl // inject local preview URL
            });
            renderGalleryGrid(contentData.images);
            showToast(`${file.name} uploaded! Previewing while site builds...`);
          } else {
            showToast(`Upload failed: ${data.error}`, true);
          }
        } catch (e) {
          showToast('Upload error', true);
        }
      }
    }

    function formatDateNZ(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString('en-NZ', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function buildHuntDatesString() {
      const start = document.getElementById('bill-huntStart').value;
      const end = document.getElementById('bill-huntEnd').value;
      if (!start) return '';
      const startFormatted = formatDateNZ(start);
      if (!end) return startFormatted; // single date
      return startFormatted + ' \u2013 ' + formatDateNZ(end); // date range
    }

    function formatDateShort(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return [
        String(d.getDate()).padStart(2, '0'),
        String(d.getMonth() + 1).padStart(2, '0'),
        d.getFullYear()
      ].join('/');
    }

    function buildHuntDatesShort() {
      const start = document.getElementById('bill-huntStart').value;
      const end = document.getElementById('bill-huntEnd').value;
      if (!start) return '';
      const startFmt = formatDateShort(start);
      if (!end) return startFmt;
      return startFmt + ' \u2013 ' + formatDateShort(end);
    }

      showToast('Contract PDF generated!');

      const cw = pw - ml - mr; // content width
      let y = mt;

      // ── Helper functions ──
      function addText(text, x, yPos, opts = {}) {
        doc.setFont(opts.font || 'times', opts.style || 'normal');
        doc.setFontSize(opts.size || 11);
        doc.setTextColor(opts.color || '#000000');
        if (opts.align === 'center') {
          doc.text(text, pw / 2, yPos, { align: 'center' });
        } else {
          doc.text(text, x, yPos);
        }
      }

      function addWrappedText(text, x, yPos, maxWidth, opts = {}) {
        doc.setFont(opts.font || 'times', opts.style || 'normal');
        doc.setFontSize(opts.size || 11);
        doc.setTextColor(opts.color || '#000000');
        const lines = doc.splitTextToSize(text, maxWidth);
        const lineHeight = (opts.size || 11) * 0.45;
        lines.forEach(line => {
          if (yPos > ph - 30) { doc.addPage(); yPos = mt; }
          doc.text(line, x, yPos);
          yPos += lineHeight;

        return yPos;

          addText(value, ml + 42, y, { size: 10, style: 'bold' });
        }
        // Underline
        doc.setDrawColor(0); doc.setLineWidth(0.3);
        doc.line(ml + 40, y + 1, ml + 40 + fieldLineLen, y + 1);
        y += 9;
      });



      // Save
      const fileName = `Contract_${clientName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
      doc.save(fileName);
    }

    async function generateInvoicePDF() {
      const clientName = document.getElementById('bill-clientName').value.trim();
      const passport = document.getElementById('bill-passport').value.trim();
      const address = document.getElementById('bill-address').value.trim();
      const invNumber = document.getElementById('bill-invNumber').value.trim();
      const issueDateVal = document.getElementById('bill-date').value;
      const totalCost = document.getElementById('bill-totalCost').value.trim();
      const advance = document.getElementById('bill-advance').value.trim();
      const balance = document.getElementById('bill-balance').value.trim();

      const paymentStatuses = [];
      if (document.getElementById('bill-status-deposit').checked) paymentStatuses.push('Deposit Received');
      if (document.getElementById('bill-status-partial').checked) paymentStatuses.push('Partial Payment');
      if (document.getElementById('bill-status-full').checked) paymentStatuses.push('Paid in Full');

      const issueDate = formatDateShort(issueDateVal) || formatDateShort(new Date());
      const huntDates = buildHuntDatesShort();

      if (!clientName || !passport) {
        showToast('Client Name and Passport Number are required', true);
        return;
      }

      const invData = {
        type: 'invoice', clientName, passport, address, invNumber, issueDate, totalCost, advance, balance, huntDates, paymentStatuses, createdAt: new Date().toISOString()
      };

      await buildInvoicePDF(invData);

      showToast('Invoice PDF generated!');
    }

    async function buildInvoicePDF(data) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const pw = 210, ph = 297;
      const ml = 30, mr = 30, mt = 25;
      const cw = pw - ml - mr;
      let y = mt;

      function addText(text, x, yPos, opts = {}) {
        doc.setFont(opts.font || 'helvetica', opts.style || 'normal');
        doc.setFontSize(opts.size || 10);
        doc.setTextColor(opts.color || '#000000');
        if (opts.align === 'center') {
          doc.text(text, pw / 2, yPos, { align: 'center' });
        } else if (opts.align === 'right') {
          doc.text(text, pw - mr, yPos, { align: 'right' });
        } else {
          doc.text(text, x, yPos);
        }
      }

      function addWrappedText(text, x, yPos, maxWidth, opts = {}) {
        doc.setFont(opts.font || 'helvetica', opts.style || 'normal');
        doc.setFontSize(opts.size || 10);
        const lines = doc.splitTextToSize(text, maxWidth);
        const lineHeight = (opts.size || 10) * 0.45;
        lines.forEach(line => {
          doc.text(line, x, yPos);
          yPos += lineHeight;
        });
        return yPos;
      }

      // Logo
      const logoData = await getLogoBase64();
      if (logoData) {
        const logoW = 35, logoH = 35;
        doc.addImage(logoData, 'PNG', (pw - logoW) / 2, y, logoW, logoH);
        y += logoH + 4;
      } else {
        y += 5;
      }

      addText('ULTIMATE', 0, y, { font: 'helvetica', style: 'bold', size: 18, align: 'center' });
      y += 7;
      addText('HUNTING SAFARI', 0, y, { font: 'helvetica', style: 'normal', size: 12, align: 'center' });
      y += 12;

      addText('Ultimate Hunting Safaris Limited', 0, y, { font: 'helvetica', style: 'bold', size: 14, align: 'center' });
      y += 16;

      addText('LUXURY SAFARI INVOICE', ml, y, { font: 'helvetica', style: 'bold', size: 12 });
      y += 10;

      const formatCurrency = (val) => val ? val.toString() : '';
      const tblY = y;
      const rowH = 10;

      const gridData = [
        ['Invoice No.', data.invNumber || '', 'Trip Dates', data.huntDates || ''],
        ['Client', data.clientName || '', 'Passport', data.passport || ''],
        ['Destination', data.address || '', 'Package Price', data.totalCost ? 'USD ' + formatCurrency(data.totalCost) : ''],
        ['Deposit', data.advance ? 'USD ' + formatCurrency(data.advance) : '', 'Balance Due', data.balance ? 'USD ' + formatCurrency(data.balance) : '']
      ];

      doc.setDrawColor(100);
      doc.setLineWidth(0.2);

      const xCols = [ml, ml + 30, ml + 75, ml + 105, pw - mr];

      for (let r = 0; r < gridData.length; r++) {
        // Horizontal line top
        doc.line(ml, y, pw - mr, y);

        let rowData = gridData[r];
        let maxLines = 1;

        const colW = [xCols[1] - xCols[0] - 4, xCols[2] - xCols[1] - 4, xCols[3] - xCols[2] - 4, xCols[4] - xCols[3] - 4];

        for (let c = 0; c < 4; c++) {
          doc.setFont('helvetica', (c === 0 || c === 2) ? 'bold' : 'normal');
          doc.setFontSize(10);
          const lines = doc.splitTextToSize(rowData[c], colW[c]);
          maxLines = Math.max(maxLines, lines.length);
          lines.forEach((line, idx) => {
            doc.text(line, xCols[c] + 2, y + 6.5 + (idx * 4.5));
          });
        }

        y += (maxLines > 1) ? rowH + (maxLines - 1) * 4.5 : rowH;
      }
      // Bottom line
      doc.line(ml, y, pw - mr, y);

      // Vertical lines
      for (let c = 0; c < xCols.length; c++) {
        doc.line(xCols[c], tblY, xCols[c], y);
      }

      y += 8;

      // Payment Details Table
      addText('Payment Details', ml, y, { style: 'bold', size: 10 });
      y += 4;

      const bankTblY = y;
      const bankData = [
        ['New Zealand Bank Details', 'Indian Bank Details'],
        ['Account Name: THE ULTIMATE HUNTING SAFARIS LTD', 'Account Name: JOSEMON JACOB'],
        ['Bank: ANZ', 'Bank: South Indian Bank\nBranch Name: MUTTOM'],
        ['Account Number: 06-0709-0972990-00', 'Account Number: 0822050000000037'],
        ['SWIFT/IFSC: ANZBNZ22', 'IFSC: SIBL0000822']
      ];

      doc.setDrawColor(100);
      doc.setLineWidth(0.2);

      const bCols = [ml, ml + cw / 2, pw - mr];

      for (let r = 0; r < bankData.length; r++) {
        doc.line(ml, y, pw - mr, y);

        doc.setFont('helvetica', (r === 0) ? 'bold' : 'normal');
        doc.setFontSize(9);

        let maxLines = 1;

        for (let c = 0; c < 2; c++) {
          const rawLines = bankData[r][c].split('\n');
          let finalLines = [];
          rawLines.forEach(rl => {
            const sl = doc.splitTextToSize(rl, (cw / 2) - 4);
            finalLines.push(...sl);
          });
          maxLines = Math.max(maxLines, finalLines.length);

          finalLines.forEach((line, idx) => {
            doc.text(line, bCols[c] + 2, y + 5.5 + (idx * 4.5));
          });
        }

        y += (maxLines > 1) ? 8 + (maxLines - 1) * 4.5 : 8;
      }
      doc.line(ml, y, pw - mr, y); // bottom line

      // vertical lines
      doc.line(bCols[0], bankTblY, bCols[0], y);
      doc.line(bCols[1], bankTblY, bCols[1], y);
      doc.line(bCols[2], bankTblY, bCols[2], y);

      y += 10;

      // Policies
      addText('Booking, Cancellation & Rescheduling Policy', ml, y, { style: 'bold', size: 11 });
      y += 6;

      const policies = [
        'A non-refundable deposit secures your booking.',
        'Your booking is confirmed upon receipt of the deposit.',
        'One complimentary reschedule is permitted if requested at least 60 days before your scheduled arrival, subject to availability.',
        'If unforeseen circumstances beyond your control (including government travel restrictions, war, disease outbreaks, natural disasters, or major airline disruptions) prevent your safari, we will happily transfer your deposit to new safari dates, subject to availability, and work with you to reschedule your adventure.'
      ];

      policies.forEach(p => {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        const lines = doc.splitTextToSize('• ' + p, cw);
        lines.forEach(line => {
          doc.text(line, ml, y);
          y += 4.5;
        });
        y += 1.5;
      });

      y += 5;

      if (data.paymentStatuses && data.paymentStatuses.length > 0) {
        // Payment Status Section
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.text('Payment Status', ml, y);
        y += 6;

        const statuses = [
          'Deposit Received',
          'Partial Payment',
          'Paid in Full'
        ];

        doc.setFont('helvetica', 'normal');
        statuses.forEach(status => {
          // Draw checkbox
          doc.setDrawColor(0);
          doc.setLineWidth(0.3);
          doc.rect(ml, y - 3, 4, 4);

          // If checked
          if (data.paymentStatuses && data.paymentStatuses.includes(status)) {
            doc.setLineWidth(0.6);
            doc.line(ml + 0.8, y - 1, ml + 1.8, y + 0.2);
            doc.line(ml + 1.8, y + 0.2, ml + 3.2, y - 2.2);
          }

          doc.text(status, ml + 7, y);
          y += 6;
        });

        if (data.balance) {
          doc.text(`Balance Remaining: $${data.balance}`, ml, y);
          y += 6;
        }

        y += 4;
      }

      if (y > 270) { doc.addPage(); y = 25; }
      addText('Thank you for choosing Ultimate Hunting Safaris Ltd.', ml, y, { font: 'helvetica', style: 'bolditalic', size: 10 });
      y += 5;
      addText('We look forward to providing you with a world-class hunting experience.', ml, y, { font: 'helvetica', style: 'italic', size: 9 });

      // Save
      const fileName = `Invoice_${data.clientName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
      doc.save(fileName);
    }

    async function generateBankingPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const pw = 210, ml = 30, mr = 30, mt = 25, cw = pw - ml - mr;
      let y = mt;

      // Logo
      const logoData = await getLogoBase64();
      if (logoData) {
        doc.addImage(logoData, 'PNG', (pw - 35) / 2, y, 35, 35);
        y += 40;
      }

      doc.setFont('helvetica', 'bold'); doc.setFontSize(18);
      doc.text('ULTIMATE', pw / 2, y, { align: 'center' }); y += 7;
      doc.setFontSize(12); doc.setFont('helvetica', 'normal');
      doc.text('HUNTING SAFARI', pw / 2, y, { align: 'center' }); y += 15;

      doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
      doc.text('BANKING DETAILS (FOR PAYMENTS)', ml, y); y += 12;

      const bankFields = [
        ['Account Name:', 'THE ULTIMATE HUNTING SAFARIS LTD'],
        ['Bank Name:', 'ANZ Bank'],
        ['Account Number:', '06-0709-0972990-00'],
        ['SWIFT / BIC Code:', 'ANZBNZ22'],
      ];

      bankFields.forEach(([label, value]) => {
        doc.setFont('times', 'bold'); doc.setFontSize(10);
        doc.text(label, ml, y);
        doc.setFont('times', 'normal');
        doc.text(value, ml + 45, y);
        y += 7;
      });

      y += 6;
      doc.setFont('times', 'bold'); doc.setFontSize(10);
      doc.text('Payment Reference: Client Name + Hunt Date', ml, y);
      y += 12;

      doc.setFont('times', 'italic'); doc.setFontSize(10);
      const lines = doc.splitTextToSize('All bank charges, international transfer fees, and currency conversion fees are the responsibility of the Client.', cw);
      doc.text(lines, ml, y);

      doc.save('Banking_Details_UHS.pdf');
      showToast('Banking Details PDF generated!');
    }

    // Toast
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    // Init
    if (token) showApp();
  </script>
