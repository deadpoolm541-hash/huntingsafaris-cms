<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UHS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0c0f14;
      --surface: #151921;
      --surface2: #1c2130;
      --border: #2a3040;
      --text: #e4e8f0;
      --text2: #8892a6;
      --accent: #3b7a57;
      --accent2: #4a9568;
      --danger: #c0392b;
      --gold: #c4953a
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh
    }

    .material-symbols-outlined {
      font-size: 20px;
      vertical-align: middle
    }

    /* Login */
    .login-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px;
      max-width: 400px;
      width: 100%;
      text-align: center
    }

    .login-box h1 {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px
    }

    .login-box h2 {
      font-size: 24px;
      margin-bottom: 32px;
      font-weight: 600
    }

    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 16px;
      outline: none
    }

    .login-box input:focus {
      border-color: var(--accent)
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer
    }

    .login-box button:hover {
      background: var(--accent2)
    }

    .login-error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none
    }

    /* Layout */
    .app {
      display: none;
      min-height: 100vh
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      overflow-y: auto;
      z-index: 10
    }

    .sidebar .brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px
    }

    .sidebar .brand h3 {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold)
    }

    .sidebar .brand p {
      font-size: 12px;
      color: var(--text2);
      margin-top: 4px
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--text2);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s
    }

    .sidebar a:hover,
    .sidebar a.active {
      color: var(--text);
      background: var(--surface2)
    }

    .sidebar a.active {
      border-left: 3px solid var(--accent);
      padding-left: 21px
    }

    .main {
      margin-left: 240px;
      padding: 32px 40px;
      max-width: 900px
    }

    .main h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px
    }

    .main .subtitle {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 32px
    }

    /* Form Elements */
    .field {
      margin-bottom: 24px
    }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 8px;
      font-weight: 600
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent)
    }

    .field textarea {
      min-height: 100px
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px
    }

    .card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      border: 2px solid var(--border);
      cursor: grab;
      background: var(--bg)
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .gallery-item .remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      background: rgba(0, 0, 0, .7);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .2s
    }

    .gallery-item:hover .remove-btn {
      opacity: 1
    }

    /* Upload Zone */
    .upload-zone {
      border: 2px dashed var(--border);
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      margin-bottom: 24px
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(59, 122, 87, .08)
    }

    .upload-zone p {
      color: var(--text2);
      font-size: 14px
    }

    .upload-zone .material-symbols-outlined {
      font-size: 36px;
      color: var(--text2);
      margin-bottom: 8px;
      display: block
    }

    /* Buttons */
    .btn {
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .15s
    }

    .btn-primary {
      background: var(--accent);
      color: #fff
    }

    .btn-primary:hover {
      background: var(--accent2)
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger)
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff
    }

    .btn:disabled {
      opacity: .5;
      cursor: wait
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      background: #1a7a42;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all .3s;
      z-index: 100
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1
    }

    .toast.error {
      background: var(--danger)
    }

    /* List editor */
    .list-editor .list-item {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center
    }

    .list-editor .list-item input {
      flex: 1
    }

    .list-editor .list-item button {
      width: 36px;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .list-editor .list-item button:hover {
      color: var(--danger);
      border-color: var(--danger)
    }

    .add-item-btn {
      padding: 8px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .add-item-btn:hover {
      color: var(--text);
      border-color: var(--accent)
    }

    /* Responsive */
    @media(max-width:768px) {
      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
        display: flex;
        overflow-x: auto;
        padding: 0
      }

      .sidebar .brand {
        display: none
      }

      .sidebar a {
        white-space: nowrap;
        padding: 16px
      }

      .main {
        margin-left: 0;
        padding: 20px
      }
    }
  </style>
</head>

<body>

  <!-- Login Screen -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-box">
      <h1>Ultimate Hunting Safaris</h1>
      <h2>Admin Panel</h2>
      <div class="login-error" id="loginError">Invalid password</div>
      <input type="password" id="passwordInput" placeholder="Enter admin password" autofocus />
      <button onclick="login()">Sign In</button>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <nav class="sidebar">
      <div class="brand">
        <h3>UHS Admin</h3>
        <p>Content Manager</p>
      </div>
      <a href="#" data-page="homepage" class="active"><span class="material-symbols-outlined">home</span> Homepage</a>
      <a href="#" data-page="services"><span class="material-symbols-outlined">confirmation_number</span> Services</a>
      <a href="#" data-page="gallery"><span class="material-symbols-outlined">photo_library</span> Gallery</a>
      <a href="#" data-page="about"><span class="material-symbols-outlined">info</span> About</a>
      <a href="#" data-page="contact"><span class="material-symbols-outlined">mail</span> Contact</a>
      <a href="#" data-page="global"><span class="material-symbols-outlined">settings</span> Global</a>
      <a href="#" onclick="logout()" style="margin-top:auto;color:var(--danger)"><span
          class="material-symbols-outlined">logout</span> Logout</a>
    </nav>
    <div class="main" id="mainContent">
      <h1 id="pageTitle">Homepage</h1>
      <p class="subtitle" id="pageSubtitle">Edit homepage content</p>
      <div id="editorArea"></div>
      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border)">
        <button class="btn btn-primary" id="saveBtn" onclick="saveContent()">
          <span class="material-symbols-outlined">save</span> Save Changes
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let token = localStorage.getItem('uhs_token');
    let currentPage = 'homepage';
    let contentData = {};

    // Auth
    async function login() {
      const pw = document.getElementById('passwordInput').value;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (res.ok) {
          token = data.token;
          localStorage.setItem('uhs_token', token);
          showApp();
        } else {
          document.getElementById('loginError').style.display = 'block';
        }
      } catch (e) {
        document.getElementById('loginError').textContent = 'Connection error';
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('uhs_token');
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadPage('homepage');
    }

    document.getElementById('passwordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    // Navigation
    document.querySelectorAll('.sidebar a[data-page]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        loadPage(a.dataset.page);
      });
    });

    // Load content
    async function loadPage(page) {
      currentPage = page;
      const titles = { homepage: 'Homepage', services: 'Services', gallery: 'Gallery', about: 'About', contact: 'Contact', global: 'Global Settings' };
      const subtitles = { homepage: 'Hero, story, team & CTA', services: 'Hunting packages', gallery: 'Photos & layout', about: 'Story & team bios', contact: 'Channels & form', global: 'Site-wide settings' };
      document.getElementById('pageTitle').textContent = titles[page] || page;
      document.getElementById('pageSubtitle').textContent = subtitles[page] || '';

      try {
        const res = await fetch(`/api/content?page=${page}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        contentData = await res.json();
        renderEditor(page, contentData);
      } catch (e) {
        document.getElementById('editorArea').innerHTML = '<p style="color:var(--danger)">Failed to load content</p>';
      }
    }

    // Save content
    async function saveContent() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined">hourglass_empty</span> Saving...';

      collectFormData();

      try {
        const res = await fetch(`/api/content?page=${currentPage}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(contentData)
        });
        if (res.ok) {
          showToast('Content saved successfully');
        } else {
          showToast('Save failed', true);
        }
      } catch (e) {
        showToast('Connection error', true);
      }
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined">save</span> Save Changes';
    }

    // Collect form values back into contentData
    function collectFormData() {
      document.querySelectorAll('[data-path]').forEach(el => {
        const path = el.dataset.path.split('.');
        let obj = contentData;
        for (let i = 0; i < path.length - 1; i++) {
          if (obj[path[i]] === undefined) obj[path[i]] = {};
          obj = obj[path[i]];
        }
        const key = path[path.length - 1];
        if (el.tagName === 'TEXTAREA' && el.dataset.type === 'array') {
          obj[key] = el.value.split('\n').filter(l => l.trim());
        } else {
          obj[key] = el.value;
        }
      });
    }

    // Render editor for each page type
    function renderEditor(page, data) {
      const area = document.getElementById('editorArea');
      let html = '';

      if (page === 'homepage') {
        html = renderSection('Hero', [
          field('hero.tagline', 'Tagline', data.hero?.tagline),
          field('hero.title', 'Title', data.hero?.title),
          field('hero.ctaText', 'Button Text', data.hero?.ctaText),
        ]) + renderSection('Our Story', [
          field('story.label', 'Label', data.story?.label),
          field('story.title', 'Title', data.story?.title),
          textarea('story.paragraphs', 'Paragraphs (one per line)', (data.story?.paragraphs || []).join('\n'), 'array'),
          field('story.ctaText', 'Button Text', data.story?.ctaText),
        ]) + renderSection('Expertise', [
          field('expertise.label', 'Label', data.expertise?.label),
          field('expertise.title', 'Title', data.expertise?.title),
          textarea('expertise.description', 'Description', data.expertise?.description),
          field('expertise.ctaText', 'Button Text', data.expertise?.ctaText),
        ]) + renderSection('Call to Action', [
          field('cta.title', 'Title', data.cta?.title),
          field('cta.description', 'Description', data.cta?.description),
          field('cta.buttonText', 'Button Text', data.cta?.buttonText),
        ]);
      }

      else if (page === 'gallery') {
        html = renderSection('Hero', [
          field('hero.label', 'Label', data.hero?.label),
          textarea('hero.quote', 'Quote', data.hero?.quote),
        ]) + renderSection('Heading', [
          field('heading', 'Gallery Heading', data.heading),
        ]) + `<div class="card"><h3><span class="material-symbols-outlined">photo_library</span> Gallery Images</h3>
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <span class="material-symbols-outlined">cloud_upload</span>
        <p>Drop images here or click to upload</p>
        <p style="font-size:12px;color:var(--text2);margin-top:4px">Auto-converted to WebP</p>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleUpload(this.files)"/>
    </div>`;
      }

      else if (page === 'about') {
        html = renderSection('Our Story', [
          field('story.label', 'Label', data.story?.label),
          field('story.title', 'Title', data.story?.title),
          textarea('story.paragraphs', 'Paragraphs (one per line)', (data.story?.paragraphs || []).join('\n'), 'array'),
        ]);
        (data.team || []).forEach((m, i) => {
          html += renderSection(`Team: ${m.name}`, [
            field(`team.${i}.name`, 'Name', m.name),
            field(`team.${i}.role`, 'Role', m.role),
            textarea(`team.${i}.bio`, 'Bio', m.bio),
          ]);
        });
      }

      else if (page === 'contact') {
        html = renderSection('Hero', [
          field('hero.label', 'Label', data.hero?.label),
          field('hero.title', 'Title', data.hero?.title),
          field('hero.description', 'Description', data.hero?.description),
        ]) + renderSection('Channels', [
          field('channels.instagram.handle', 'Instagram Handle', data.channels?.instagram?.handle),
          field('channels.instagram.url', 'Instagram URL', data.channels?.instagram?.url),
          field('channels.whatsapp.number', 'WhatsApp Number', data.channels?.whatsapp?.number),
          field('channels.whatsapp.url', 'WhatsApp URL', data.channels?.whatsapp?.url),
          field('channels.email.address', 'Email', data.channels?.email?.address),
        ]) + renderSection('Form', [
          field('form.title', 'Form Title', data.form?.title),
          field('form.description', 'Form Description', data.form?.description),
          field('form.formspreeId', 'Formspree ID', data.form?.formspreeId),
        ]);
      }

      else if (page === 'services') {
        html = renderSection('Hero', [
          field('hero.label', 'Label', data.hero?.label),
          field('hero.title', 'Title', data.hero?.title),
          textarea('hero.description', 'Description', data.hero?.description),
        ]) + renderSection('Section Header', [
          field('sectionLabel', 'Label', data.sectionLabel),
          field('sectionTitle', 'Title', data.sectionTitle),
        ]);
        (data.packages || []).forEach((pkg, i) => {
          let fields = [
            field(`packages.${i}.label`, 'Label', pkg.label),
            field(`packages.${i}.title`, 'Title', pkg.title),
            textarea(`packages.${i}.description`, 'Description', pkg.description || ''),
            textarea(`packages.${i}.inclusions`, 'Inclusions (one per line)', (pkg.inclusions || []).join('\n'), 'array'),
          ];

          if (pkg.id === 'package-nz') {
            fields.push(field(`packages.${i}.subtitle`, 'Subtitle', pkg.subtitle));
            fields.push(textarea(`packages.${i}.beginnerFeatures`, 'Beginner Features (one per line)', (pkg.beginnerFeatures || []).join('\n'), 'array'));
            fields.push(textarea(`packages.${i}.gameSpecies`, 'Game Species (one per line)', (pkg.gameSpecies || []).join('\n'), 'array'));
            fields.push(field(`packages.${i}.gameNote`, 'Game Note', pkg.gameNote));
            fields.push(field(`packages.${i}.whyChoose.heading`, 'Why Choose - Heading', pkg.whyChoose?.heading));
            fields.push(textarea(`packages.${i}.whyChoose.points`, 'Why Choose - Points', (pkg.whyChoose?.points || []).join('\n'), 'array'));
            fields.push(textarea(`packages.${i}.whyChoose.note`, 'Why Choose - Note', pkg.whyChoose?.note));
          } else if (pkg.id === 'package-africa') {
            fields.push(field(`packages.${i}.beginnerNote.heading`, 'Beginner Note - Heading', pkg.beginnerNote?.heading));
            fields.push(field(`packages.${i}.beginnerNote.subtitle`, 'Beginner Note - Subtitle', pkg.beginnerNote?.subtitle));
            fields.push(textarea(`packages.${i}.beginnerNote.points`, 'Beginner Note - Points', (pkg.beginnerNote?.points || []).join('\n'), 'array'));
            fields.push(textarea(`packages.${i}.huntingIncluded`, 'Hunting Included (one per line)', (pkg.huntingIncluded || []).join('\n'), 'array'));
            fields.push(textarea(`packages.${i}.additionalBigGame`, 'Additional Big Game (one per line)', (pkg.additionalBigGame || []).join('\n'), 'array'));
          } else if (pkg.id === 'package-namibia') {
            fields.push(textarea(`packages.${i}.highlightedInclusion`, 'Highlighted Inclusion', pkg.highlightedInclusion));
            fields.push(textarea(`packages.${i}.inclusionNote`, 'Inclusion Note', pkg.inclusionNote));
            fields.push(textarea(`packages.${i}.huntingIncluded`, 'Hunting Included (one per line)', (pkg.huntingIncluded || []).join('\n'), 'array'));
          }

          fields.push(field(`packages.${i}.offerCard.heading`, 'Offer Heading', pkg.offerCard?.heading));
          fields.push(field(`packages.${i}.offerCard.duration`, 'Offer Duration', pkg.offerCard?.duration));
          fields.push(field(`packages.${i}.offerCard.bonus`, 'Offer Bonus', pkg.offerCard?.bonus));

          html += renderSection(`Package: ${pkg.title}`, fields);
        });
      }

      else if (page === 'global') {
        html = renderSection('Site Info', [
          field('siteName', 'Site Name', data.siteName),
          field('canonicalBase', 'Base URL', data.canonicalBase),
        ]) + renderSection('Social', [
          field('social.youtube', 'YouTube URL', data.social?.youtube),
          field('social.instagram', 'Instagram URL', data.social?.instagram),
        ]) + renderSection('Footer', [
          field('footer.description', 'Description', data.footer?.description),
          field('footer.copyright', 'Copyright', data.footer?.copyright),
        ]) + renderSection('Contact', [
          field('contact.phone', 'Phone', data.contact?.phone),
          field('contact.email', 'Email', data.contact?.email),
        ]);
      }

      area.innerHTML = html;

      // Render gallery grid if on gallery page
      if (page === 'gallery') renderGalleryGrid(data.images || []);

      // Setup upload zone drag-and-drop
      const uz = document.getElementById('uploadZone');
      if (uz) {
        uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('dragover'); });
        uz.addEventListener('dragleave', () => uz.classList.remove('dragover'));
        uz.addEventListener('drop', e => { e.preventDefault(); uz.classList.remove('dragover'); handleUpload(e.dataTransfer.files); });
      }
    }

    function field(path, label, value) {
      return `<div class="field"><label>${label}</label><input data-path="${path}" value="${escHtml(value || '')}"/></div>`;
    }
    function textarea(path, label, value, type) {
      return `<div class="field"><label>${label}</label><textarea data-path="${path}" ${type ? `data-type="${type}"` : ''} rows="4">${escHtml(value || '')}</textarea></div>`;
    }
    function renderSection(title, fields) {
      return `<div class="card"><h3>${title}</h3>${fields.join('')}</div>`;
    }
    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Gallery management
    function renderGalleryGrid(images) {
      const grid = document.getElementById('galleryGrid');
      if (!grid) return;
      grid.innerHTML = images.map((img, i) => `
    <div class="gallery-item" draggable="true" data-index="${i}">
      <img src="${img._tempUrl ? img._tempUrl : '/' + img.src}" alt="Gallery ${i + 1}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22><rect fill=%22%231c2130%22 width=%22200%22 height=%22150%22/><text x=%2250%%22 y=%2250%%22 fill=%22%23555%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2212%22>${escHtml(img.src)}</text></svg>'"/>
      <button class="remove-btn" onclick="removeGalleryImage(${i})"><span class="material-symbols-outlined" style="font-size:16px">close</span></button>
    </div>
  `).join('');

      // Drag and drop reorder
      grid.querySelectorAll('.gallery-item').forEach(item => {
        item.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', item.dataset.index); item.style.opacity = '0.4'; });
        item.addEventListener('dragend', () => { item.style.opacity = '1'; });
        item.addEventListener('dragover', e => { e.preventDefault(); item.style.borderColor = 'var(--accent)'; });
        item.addEventListener('dragleave', () => { item.style.borderColor = 'var(--border)'; });
        item.addEventListener('drop', e => {
          e.preventDefault();
          item.style.borderColor = 'var(--border)';
          const from = parseInt(e.dataTransfer.getData('text/plain'));
          const to = parseInt(item.dataset.index);
          if (from !== to) {
            const imgs = contentData.images;
            const [moved] = imgs.splice(from, 1);
            imgs.splice(to, 0, moved);
            renderGalleryGrid(imgs);
          }
        });
      });
    }

    function removeGalleryImage(index) {
      if (!confirm('Remove this image from the gallery?')) return;
      contentData.images.splice(index, 1);
      renderGalleryGrid(contentData.images);
    }

    async function handleUpload(files) {
      for (const file of files) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('directory', 'photo_gallery');
        showToast(`Uploading ${file.name}...`);
        
        // Generate an immediate local preview URL
        const tempUrl = URL.createObjectURL(file);
        
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            contentData.images = contentData.images || [];
            contentData.images.push({ 
              src: data.path, 
              colSpan: 4, 
              height: 400, 
              effect: 'none',
              _tempUrl: tempUrl // inject local preview URL
            });
            renderGalleryGrid(contentData.images);
            showToast(`${file.name} uploaded! Previewing while site builds...`);
          } else {
            showToast(`Upload failed: ${data.error}`, true);
          }
        } catch (e) {
          showToast('Upload error', true);
        }
      }
    }

    // Toast
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    // Init
    if (token) showApp();
  </script>
</body>

</html>
